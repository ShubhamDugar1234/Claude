# Production: the portal, its database, HTTPS (Caddy) and the daily job.
# Start or update with:  docker compose up -d --build
# All settings come from the .env file next to this one (see .env.example and README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      retries: 20

  # Applies database changes and the seed, then exits. Runs on every "up".
  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. ai.mvdugar.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Runs the daily job at 21:15 UTC (03:00 in Nepal): deletes old chats, cleans up.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    command: >
      sh -c 'echo "15 21 * * * wget -q -O /dev/null --header=\"Authorization: Bearer $$CRON_SECRET\" --post-data=\"\" http://app:3000/api/cron/daily" > /etc/crontabs/root && crond -f -l 8'
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
